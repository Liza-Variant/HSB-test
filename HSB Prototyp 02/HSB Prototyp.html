-height:1.6\">\n            <div>”Jag tycker Ekonomi Bas verkligen har hjälpt vår brf att få ordning på ekonomin”<\u002Fdiv>\n            <div style=\"color:#5a5a5a; margin-top:8px\">Nöjd kund kommentarer<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:16px; align-items:flex-start\">\n          <div style=\"width:76px; height:76px; border-radius:50%; background:#dcdcdc; flex:none\"><\u002Fdiv>\n          <div style=\"font-size:12px; line-height:1.6\">\n            <div>”Asdasdas da as da asdad asd a da sdasd as dasd asdasd as da dasdd addd ”<\u002Fdiv>\n            <div style=\"color:#5a5a5a; margin-top:8px\">Nöjd kund kommentarer<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:#d9d9d9; padding:48px 20px\">\n      <div style=\"max-width:900px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:24px\">\n        <div style=\"background:#f2f2f2; padding:22px\">\n          <h3 style=\"font-size:18px; margin:0 0 16px\">Kontakt<\u002Fh3>\n          <div style=\"display:flex; flex-direction:column; gap:14px\">\n            <div style=\"display:flex; gap:16px; align-items:center\">\n              <div style=\"width:96px; height:82px; background:#111; flex:none\"><\u002Fdiv>\n              <div style=\"font-size:12px; line-height:1.6\">\n                <div style=\"font-weight:600; font-size:13px\">Sara Adamsson<\u002Fdiv>\n                <div style=\"color:#5a5a5a\">Säljare<\u002Fdiv>\n                <div style=\"text-decoration:underline; margin-top:4px\">070-111 22 33<\u002Fdiv>\n                <div style=\"text-decoration:underline\">xxxxx.xxxxx@hsb.se<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:16px; align-items:center\">\n              <div style=\"width:96px; height:82px; background:#111; flex:none\"><\u002Fdiv>\n              <div style=\"font-size:12px; line-height:1.6\">\n                <div style=\"font-weight:600; font-size:13px\">Adam Adamsson<\u002Fdiv>\n                <div style=\"color:#5a5a5a\">Säljare<\u002Fdiv>\n                <div style=\"text-decoration:underline; margin-top:4px\">070-111 22 33<\u002Fdiv>\n                <div style=\"text-decoration:underline\">xxxxx.xxxxx@hsb.se<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#f2f2f2; padding:22px\">\n          <h3 style=\"font-size:18px; margin:0 0 16px\">Dokument och länkar<\u002Fh3>\n          <div style=\"display:flex; flex-direction:column; gap:8px\">\n            <sc-for list=\"{{ docsEkonomi }}\" as=\"doc\" hint-placeholder-count=\"6\">\n              <div style=\"background:#fff; border:1px solid #e4e4e4; border-radius:4px; padding:11px 14px; display:flex; align-items:center; gap:10px; cursor:pointer\" style-hover=\"border-color:#111\">\n                <span style=\"width:16px; height:18px; background:#d4d4d4; flex:none\"><\u002Fspan>\n                <span style=\"font-size:13px; text-decoration:underline; flex:1\">{{ doc.name }}<\u002Fspan>\n                <span style=\"font-size:13px; color:#6a6a6a\">{{ doc.icon }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <dc-import name=\"FaqSection\" label=\"HSB Ekonomi\" q1=\"Hur kommer det bli med kommunikation till området?\" hint-size=\"100%,360px\"><\u002Fdc-import>\n    <dc-import name=\"ArticlesSection\" hint-size=\"100%,420px\"><\u002Fdc-import>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ Digital köhantering ============ -->\n  <sc-if value=\"{{ isKo }}\" hint-placeholder-val=\"{{ true }}\">\n  <main style=\"flex:1\">\n    <div style=\"background:#ececec; height:clamp(120px,20vw,200px)\"><\u002Fdiv>\n    <section style=\"padding:44px 20px 20px\">\n      <div style=\"max-width:620px; margin:0 auto\">\n        <h1 style=\"font-size:clamp(30px,6vw,46px); line-height:1.1; margin:0 0 16px\">Digital köhantering<\u002Fh1>\n        <div style=\"display:inline-block; background:#e9e9e9; border-radius:4px; padding:6px 10px; font-size:12px; margin-bottom:22px\">Tjänsten gäller alla HSBs regionsföreningar<\u002Fdiv>\n        <p style=\"font-size:16px; line-height:1.6; margin:0 0 26px\">En stabil grund att stå på inom ekonomisk förvaltning. Ni får koll på ekonomin och det administrativa och gör det enkelt att leva upp till lagar och regler. Alla är välkomna att ta del av tjänsten, även de som inte är medlemmar i HSB.<\u002Fp>\n        <div style=\"display:flex; gap:10px; flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ openSheet }}\" style=\"background:#111; color:#fff; border:none; border-radius:6px; padding:12px 20px; font-size:14px; font-weight:600; cursor:pointer\" style-hover=\"opacity:.9\">Offertförfrågan<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ openSheet }}\" style=\"background:#e6e6e6; border:none; border-radius:6px; padding:12px 20px; font-size:14px; cursor:pointer\" style-hover=\"background:#dadada\">Kontakta mig<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <div style=\"padding:20px; max-width:1180px; margin:0 auto\"><div style=\"background:#d4d4d4; aspect-ratio:16/9; width:100%; max-width:820px; margin:0 auto\"><\u002Fdiv><\u002Fdiv>\n\n    <section style=\"padding:28px 20px 20px\">\n      <div style=\"max-width:620px; margin:0 auto\">\n        <h2 style=\"font-size:clamp(20px,3vw,25px); margin:0 0 14px\">Underrubrik<\u002Fh2>\n        <p style=\"font-size:13px; line-height:1.65; margin:0 0 14px\">En stabil grund att stå på inom ekonomisk förvaltning. Ni får koll på ekonomin och det administrativa och gör det enkelt att leva upp till lagar och regler. Alla är välkomna att ta del av tjänsten, även de som inte är medlemmar i HSB.<\u002Fp>\n        <p style=\"font-size:13px; line-height:1.65; margin:0 0 14px\">En stabil grund att stå på inom ekonomisk förvaltning. Ni får koll på ekonomin och det administrativa och gör det enkelt att leva upp till lagar och regler. Alla är välkomna att ta del av tjänsten, även de som inte är medlemmar i HSB.<\u002Fp>\n        <ul style=\"margin:0 0 14px; padding-left:20px; font-size:13px; line-height:1.8\">\n          <li>Punktlista<\u002Fli>\n          <li>Punktlista<\u002Fli>\n          <li>Punktlista<\u002Fli>\n        <\u002Ful>\n        <p style=\"font-size:13px; line-height:1.65; margin:0\">En stabil grund att stå på inom ekonomisk förvaltning. Ni får koll på ekonomin och det administrativa och gör det enkelt att leva upp till lagar och regler. Alla är välkomna att ta del av tjänsten, även de som inte är medlemmar i HSB.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding:28px 20px\">\n      <div style=\"max-width:620px; margin:0 auto\">\n        <h2 style=\"font-size:clamp(20px,3vw,25px); margin:0 0 14px\">Underrubrik<\u002Fh2>\n        <p style=\"font-size:13px; line-height:1.65; margin:0 0 20px\">En stabil grund att stå på inom ekonomisk förvaltning. Ni får koll på ekonomin och det administrativa och gör det enkelt att leva upp till lagar och regler. Alla är välkomna att ta del av tjänsten, även de som inte är medlemmar i HSB.<\u002Fp>\n        <div style=\"border:1px solid #dcdcdc; border-radius:4px; padding:12px; display:flex; flex-direction:column; gap:10px\">\n          <div style=\"display:flex; align-items:center; gap:10px; cursor:pointer\">\n            <span style=\"width:16px; height:18px; background:#d4d4d4; flex:none\"><\u002Fspan>\n            <span style=\"font-size:13px; flex:1\">För dig som inte kan lämna Betan<\u002Fspan>\n            <span style=\"font-size:14px; color:#6a6a6a\">↓<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:10px; cursor:pointer\">\n            <span style=\"width:16px; height:18px; background:#d4d4d4; flex:none\"><\u002Fspan>\n            <span style=\"font-size:13px; flex:1\">För dig som aldrig vill lämna Betan<\u002Fspan>\n            <span style=\"font-size:14px; color:#6a6a6a\">↓<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding:12px 20px 44px\">\n      <div style=\"max-width:620px; margin:0 auto; background:#f2f2f2; padding:24px\">\n        <h2 style=\"font-size:clamp(19px,2.8vw,23px); margin:0 0 12px\">Digital köhantering är en viktig tilläggstjänst till Ekonomi Bas tjänstepaket<\u002Fh2>\n        <p style=\"font-size:13px; line-height:1.65; margin:0 0 14px\">En stabil grund att stå på inom ekonomisk förvaltning. Ni får koll på ekonomin och det administrativa och gör det enkelt att leva upp till lagar och regler. Alla är välkomna att ta del av tjänsten, även de som inte är medlemmar i HSB.<\u002Fp>\n        <a href=\"#ekonomi\" sc-camel-on-click=\"{{ goEkonomi }}\" style=\"font-size:13px; text-decoration:underline\">Till Ekonomi Bas<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n\n    <dc-import name=\"FaqSection\" label=\"HSB Ekonomi\" q1=\"Hur kommer det bli med kommunikation till området?\" hint-size=\"100%,360px\"><\u002Fdc-import>\n    <dc-import name=\"ArticlesSection\" hint-size=\"100%,420px\"><\u002Fdc-import>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ Nyckeltalsanalys ============ -->\n  <sc-if value=\"{{ isNyckeltal }}\" hint-placeholder-val=\"{{ true }}\">\n  <main style=\"flex:1; background:#fafafa\">\n    <section style=\"padding:36px 20px 28px\">\n      <div style=\"max-width:620px; margin:0 auto\">\n        <h1 style=\"font-size:clamp(32px,6vw,48px); line-height:1.1; margin:0 0 12px\">Nyckeltalsanalys<\u002Fh1>\n        <div style=\"display:inline-block; background:#e4e4e4; border-radius:4px; padding:5px 9px; font-size:12px; margin-bottom:20px\">Lokala avvikelser kan förekomma<\u002Fdiv>\n        <p style=\"font-size:17px; line-height:1.55; margin:0 0 24px\">Har ni koll på föreningens kostnader? Är era utgifter i linje med andra bostadsrättsföreningar? Med HSB Malmös nyckeltalsanalys får ni en tydlig bild av er ekonomi och kan identifiera möjligheter till besparingar och förbättringar.<\u002Fp>\n        <div style=\"display:flex; gap:10px; flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ openSheet }}\" style=\"background:#111; color:#fff; border:none; border-radius:6px; padding:12px 20px; font-size:14px; font-weight:600; cursor:pointer\" style-hover=\"opacity:.9\">Offertförfrågan<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ openSheet }}\" style=\"background:#dedede; border:none; border-radius:6px; padding:12px 20px; font-size:14px; cursor:pointer\" style-hover=\"background:#d2d2d2\">Kontakta mig<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <div style=\"padding:12px 20px\"><div style=\"background:#d4d4d4; aspect-ratio:16/8; width:100%; max-width:820px; margin:0 auto\"><\u002Fdiv><\u002Fdiv>\n    <section style=\"padding:32px 20px 8px\">\n      <div style=\"max-width:620px; margin:0 auto\">\n        <p style=\"font-size:14px; line-height:1.65; margin:0 0 16px\">Nyckeltalsanalysen är ett värdefullt komplement till föreningens ekonomiska förvaltning och ger styrelsen ett fördjupat underlag för att följa upp kostnader, jämföra sig med andra och fatta välgrundade beslut.<\u002Fp>\n        <p style=\"font-size:14px; line-height:1.65; margin:0 0 16px\">Genom att jämföra er förenings nyckeltal med liknande bostadsrättsföreningar i vårt område ser vi var ni ligger i förhållande till andra – både vad ni gör bra och var det finns utrymme för förbättringar. Ni får en detaljerad analys av drift- och fastighetskostnader samt finansiell status, så att styrelsen kan fatta välgrundade beslut och optimera ekonomin.<\u002Fp>\n        <h2 style=\"font-size:clamp(22px,3.2vw,26px); margin:28px 0 16px\">Vad ingår i nyckeltalsanalysen?<\u002Fh2>\n        <ul style=\"margin:0 0 16px; padding-left:20px; font-size:14px; line-height:1.65; display:flex; flex-direction:column; gap:6px\">\n          <li><strong>Finansiella nyckeltal<\u002Fstrong> – Hur ser föreningens sparande, belåning och räntekänslighet ut jämfört med andra? Vi analyserar snitträntor, likviditet och långsiktig ekonomisk hållbarhet.<\u002Fli>\n          <li><strong>Driftnyckeltal<\u002Fstrong> – Betalar ni för mycket för värme, el, sophämtning eller försäkringar? Vi går igenom era driftskostnader och visar var ni kan optimera utgifterna.<\u002Fli>\n          <li><strong>Komponentanalys<\u002Fstrong> – En genomgång av fastighetens långsiktiga underhållskostnader. Vi hjälper er att identifiera möjliga investeringar som kan öka fastighetens värde, till exempel genom energieffektivisering, modernisering av tvättstuga eller uppgradering av hissar och belysning.<\u002Fli>\n        <\u002Ful>\n        <p style=\"font-size:14px; line-height:1.65; margin:0 0 16px\">Resultatet presenteras på ett lättöverskådligt sätt med tydliga grafer och analyser. Dessutom får ni konkreta åtgärdsförslag för att optimera föreningens ekonomi och framtida investeringar.<\u002Fp>\n        <h2 style=\"font-size:clamp(22px,3.2vw,26px); margin:28px 0 18px\">Fyra anledningar att göra en nyckeltalsanalys<\u002Fh2>\n        <div style=\"display:flex; flex-direction:column; gap:16px; margin-bottom:32px\">\n            <div style=\"display:flex; gap:14px; align-items:flex-start\">\n              <span style=\"width:28px; height:28px; border-radius:50%; background:#111; color:#fff; font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center; flex:none\">1<\u002Fspan>\n              <span style=\"font-size:14px; line-height:1.55; padding-top:4px\">Jämför er förening med andra liknande bostadsrättsföreningar – få en tydlig bild av hur ni ligger till ekonomiskt.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:14px; align-items:flex-start\">\n              <span style=\"width:28px; height:28px; border-radius:50%; background:#111; color:#fff; font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center; flex:none\">2<\u002Fspan>\n              <span style=\"font-size:14px; line-height:1.55; padding-top:4px\">Få nyckeltal presenterade i visuella rapporter – lättförståeliga grafer och tabeller underlättar styrelsearbetet.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:14px; align-items:flex-start\">\n              <span style=\"width:28px; height:28px; border-radius:50%; background:#111; color:#fff; font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center; flex:none\">3<\u002Fspan>\n              <span style=\"font-size:14px; line-height:1.55; padding-top:4px\">Använd informationen vid kommunikation med medlemmar och potentiella köpare – stärk förtroendet genom att visa en väl genomarbetad ekonomisk plan.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:14px; align-items:flex-start\">\n              <span style=\"width:28px; height:28px; border-radius:50%; background:#111; color:#fff; font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center; flex:none\">4<\u002Fspan>\n              <span style=\"font-size:14px; line-height:1.55; padding-top:4px\">Identifiera besparingar tidigt – se var kostnaderna sticker ut och prioritera rätt åtgärder.<\u002Fspan>\n            <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#efefef; padding:22px; margin-bottom:22px\">\n          <h3 style=\"font-size:18px; margin:0 0 10px\">Vill ni veta mer?<\u002Fh3>\n          <p style=\"font-size:14px; line-height:1.6; margin:0\">Vill ni ha en kostnadsfri offert eller rådgivning om nyckeltalsanalys? <a href=\"#\" sc-camel-on-click=\"{{ openSheet }}\" style=\"text-decoration:underline\">Kontakta oss<\u002Fa> så berättar vi mer om hur HSB Malmö kan hjälpa er bostadsrättsförening att skapa en stabil och hållbar ekonomi.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:12px; align-items:center; background:#efefef; border-left:5px solid #111; padding:14px 16px; font-size:14px; font-weight:600; margin-bottom:24px\">\n          <span style=\"width:20px; height:20px; border:1.5px solid #111; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; flex:none\">i<\u002Fspan>\n          <span>Lokala avvikelser kan förekomma<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding-bottom:40px\">\n          <span style=\"font-size:13px; color:#4a4a4a\">Taggar:<\u002Fspan>\n          <span style=\"border:1px solid #cfcfcf; background:#fff; border-radius:4px; padding:6px 10px; font-size:12px\">Ekonomisk förvaltning<\u002Fspan>\n          <span style=\"border:1px solid #cfcfcf; background:#fff; border-radius:4px; padding:6px 10px; font-size:12px\">Styrelsearbete<\u002Fspan>\n          <span style=\"border:1px solid #cfcfcf; background:#fff; border-radius:4px; padding:6px 10px; font-size:12px\">Budget och kostnader<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"background:#efefef; padding:40px 20px\">\n      <div style=\"max-width:820px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr)); gap:28px; align-items:center\">\n        <div style=\"background:#c4c4c4; aspect-ratio:1/1; width:100%; max-width:130px\"><\u002Fdiv>\n        <div style=\"grid-column:span 2; min-width:0\">\n          <h3 style=\"font-size:20px; margin:0 0 10px\">En bra tilläggstjänst till Ekonomi Bas<\u002Fh3>\n          <p style=\"font-size:15px; line-height:1.55; margin:0 0 18px\">Med Ekonomi Bas får ni en stabil grund för föreningens ekonomi – samtidigt som styrelsen behåller insyn och kontroll.<\u002Fp>\n          <div style=\"display:flex; gap:10px; flex-wrap:wrap\">\n            <button sc-camel-on-click=\"{{ goEkonomi }}\" style=\"background:#111; color:#fff; border:none; border-radius:6px; padding:12px 20px; font-size:14px; font-weight:600; cursor:pointer\" style-hover=\"opacity:.9\">Ekonomi Bas<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ openSheet }}\" style=\"background:#fff; border:1px solid #cfcfcf; border-radius:6px; padding:12px 20px; font-size:14px; cursor:pointer\" style-hover=\"border-color:#111\">Offertförfrågan<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <dc-import name=\"ArticlesSection\" t1=\"Juristens råd: Tänk på detta när du ska köpa bostadsrätt\" t2=\"Guide: Så gör du en månadsbudget\" t3=\"Får grannen gå in i min lägenhet om min fest stör?\" hint-size=\"100%,420px\"><\u002Fdc-import>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <footer style=\"background:#4a4a4a; color:#fff; padding:76px 20px; text-align:center\">\n    <div style=\"font-size:20px; font-weight:600\">Footer<\u002Fdiv>\n  <\u002Ffooter>\n<sc-if value=\"{{ sheetOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; z-index:100; display:flex; justify-content:flex-end\">\n      <div sc-camel-on-click=\"{{ closeSheet }}\" style=\"position:absolute; inset:0; background:rgba(0,0,0,.45)\"><\u002Fdiv>\n      <aside role=\"dialog\" aria-label=\"Offertförfrågan\" style=\"position:relative; width:min(100%,520px); height:100%; overflow-y:auto; background:#fff; box-shadow:-8px 0 24px rgba(0,0,0,.2); padding:28px clamp(18px,4vw,26px) 40px; display:flex; flex-direction:column; gap:22px\">\n        <div style=\"display:flex; align-items:flex-start; gap:16px\">\n          <h2 style=\"font-size:clamp(22px,3vw,26px); line-height:1.2; margin:0; flex:1\">Offertförfrågan - kontakta mig<\u002Fh2>\n          <button sc-camel-on-click=\"{{ closeSheet }}\" aria-label=\"Stäng\" style=\"background:none; border:none; font-size:22px; line-height:1; cursor:pointer; padding:6px; min-width:44px; min-height:44px; color:#111\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ sheetSent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; flex-direction:column; gap:16px\">\n            <div style=\"background:#f2f2f2; padding:20px; font-size:15px; line-height:1.6\">Tack! Vi har tagit emot din offertförfrågan och återkommer till dig så snart som möjligt.<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ closeSheet }}\" style=\"background:#111; color:#fff; border:none; border-radius:6px; padding:14px 20px; font-size:15px; font-weight:600; cursor:pointer\" style-hover=\"opacity:.9\">Stäng<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ sheetForm }}\" hint-placeholder-val=\"{{ true }}\">\n          <p style=\"font-size:15px; line-height:1.55; margin:0\">Är du intresserad av att veta mer om våra förvaltningstjänster? Fyll i formuläret nedan så återkommer vi till dig så snart som möjligt!<\u002Fp>\n          <div style=\"display:flex; gap:14px; background:#f2f2f2; border-left:6px solid #111; padding:16px 18px; font-size:14px; line-height:1.55\">\n            <span style=\"width:22px; height:22px; border:1.5px solid #111; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600\">i<\u002Fspan>\n            <span>Vill du göra en <a href=\"#\" style=\"text-decoration:underline\">felanmälan<\u002Fa> eller kontakta <a href=\"#\" style=\"text-decoration:underline\">kund och medlemsservice<\u002Fa> så kontaktar du dem via länkarna. Är du redan kund hos oss kan du få hjälp lättare genom att <a href=\"#\" style=\"text-decoration:underline\">logga in<\u002Fa>.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:10px\">\n            <div style=\"font-size:14px; font-weight:600\">Vilket område är du intresserad av att prata mer om<\u002Fdiv>\n            <sc-for list=\"{{ sheetAreas }}\" as=\"ar\" hint-placeholder-count=\"6\">\n              <label style=\"display:flex; align-items:center; gap:10px; font-size:14px; cursor:pointer; min-height:28px\">\n                <input type=\"checkbox\" checked=\"{{ ar.checked }}\" sc-camel-on-change=\"{{ ar.toggle }}\" style=\"width:20px; height:20px; accent-color:#111; margin:0; flex:none\">\n                <span>{{ ar.label }}<\u002Fspan>\n              <\u002Flabel>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <label style=\"display:flex; flex-direction:column; gap:8px; font-size:14px; font-weight:600\">Beskriv gärna era behov här\n            <textarea placeholder=\"Meddelande\" rows=\"6\" style=\"width:100%; padding:13px 14px; border:1px solid #9a9a9a; border-radius:6px; font:inherit; font-size:15px; background:#fff; color:#111; font-weight:400; resize:vertical\"><\u002Ftextarea>\n          <\u002Flabel>\n          <label style=\"display:flex; flex-direction:column; gap:8px; font-size:14px; font-weight:600\">*Bostadsrättsförening/organisation\n            <input placeholder=\"Brf Namn\" style=\"width:100%; padding:13px 14px; border:1px solid #9a9a9a; border-radius:6px; font:inherit; font-size:15px; background:#fff; color:#111; font-weight:400\">\n          <\u002Flabel>\n          <label style=\"display:flex; flex-direction:column; gap:8px; font-size:14px; font-weight:600\">Postnummer\n            <input sc-camel-input-mode=\"numeric\" placeholder=\"Ex. 113 64\" style=\"width:100%; padding:13px 14px; border:1px solid #9a9a9a; border-radius:6px; font:inherit; font-size:15px; background:#fff; color:#111; font-weight:400\">\n          <\u002Flabel>\n          <label style=\"display:flex; flex-direction:column; gap:8px; font-size:14px; font-weight:600\">Kontaktperson\n            <input placeholder=\"Ditt namn\" style=\"width:100%; padding:13px 14px; border:1px solid #9a9a9a; border-radius:6px; font:inherit; font-size:15px; background:#fff; color:#111; font-weight:400\">\n          <\u002Flabel>\n          <label style=\"display:flex; flex-direction:column; gap:8px; font-size:14px; font-weight:600\">*Telefon\n            <input type=\"tel\" placeholder=\"070-XXX XX XX\" style=\"width:100%; padding:13px 14px; border:1px solid #9a9a9a; border-radius:6px; font:inherit; font-size:15px; background:#fff; color:#111; font-weight:400\">\n          <\u002Flabel>\n          <label style=\"display:flex; flex-direction:column; gap:8px; font-size:14px; font-weight:600\">*E-post\n            <input type=\"email\" placeholder=\"exempel@exempel.se\" style=\"width:100%; padding:13px 14px; border:1px solid #9a9a9a; border-radius:6px; font:inherit; font-size:15px; background:#fff; color:#111; font-weight:400\">\n          <\u002Flabel>\n          <div style=\"display:flex; flex-direction:column; gap:10px\">\n            <div style=\"font-size:17px; font-weight:600\">Bilagor<\u002Fdiv>\n            <div style=\"border:2px dashed #9a9a9a; border-radius:6px; padding:36px 16px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center\">\n              <span style=\"font-size:22px\">⤒<\u002Fspan>\n              <div style=\"font-size:15px; font-weight:600\">Dra in och släpp PDF-filer här<\u002Fdiv>\n              <div style=\"font-size:13px; color:#5a5a5a\">eller...<\u002Fdiv>\n              <div style=\"display:flex; gap:10px; flex-wrap:wrap; justify-content:center\">\n                <button style=\"background:#f2f2f2; border:none; border-radius:6px; padding:11px 14px; font-size:13px; cursor:pointer; min-height:44px\" style-hover=\"background:#e4e4e4\">Hämta från Dokument<\u002Fbutton>\n                <button style=\"background:#f2f2f2; border:none; border-radius:6px; padding:11px 14px; font-size:13px; cursor:pointer; min-height:44px\" style-hover=\"background:#e4e4e4\">Bläddra bland dina filer<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\  för brf|Betallösning för elbilsladdning i brf|Fasadrenovering brf|Bygga och renovera balkong brf|Fönsterbyte för brf i Norrköping|Takbyte|Dörrbyte för brf i Norrköping|Hissbyte för brf i Norrköping|Tillgänglighetsanpassning i brf i Norrköping|Tillbyggnad fastighet för brf i Norrköping|Renovering av tvättstuga för brf i Norrköping\"};\nconst PAGES = [\"start\", \"hub\", \"forvaltar\", \"ekonomi\", \"ko\", \"nyckeltal\"];\n\nclass Component extends DCLogic {\n  state = { page: \"start\", openRow: null, openFaq: null, filter: \"Alla\", addonFilter: \"Alla\", forening: \"I hela HSB-Sverige\", menu1: false, menu2: false };\n\n  componentDidMount() {\n    const fromHash = () => {\n      const h = (location.hash || \"\").replace(\"#\", \"\");\n      if (PAGES.includes(h)) this.setState({ page: h });\n    };\n    fromHash();\n    this._onHash = fromHash;\n    window.addEventListener(\"hashchange\", this._onHash);\n    this._onResize = () => {\n      const m = window.innerWidth < 640;\n      const w = window.innerWidth;\n      if (m !== this.state.isMobile || w !== this.state.vw) this.setState({ isMobile: m, vw: w });\n    };\n    this._onResize();\n    window.addEventListener(\"resize\", this._onResize);\n  }\n  componentWillUnmount() {\n    window.removeEventListener(\"hashchange\", this._onHash);\n    window.removeEventListener(\"resize\", this._onResize);\n  }\n\n  nav(page) {\n    return (e) => {\n      if (e && e.preventDefault) e.preventDefault();\n      this.setState({ page, openRow: null, openFaq: null });\n      if (history && history.replaceState) history.replaceState(null, \"\", \"#\" + page);\n      const s = document.scrollingElement || document.documentElement;\n      s.scrollTop = 0;\n      if (window.parent !== window) window.scrollTo(0, 0);\n    };\n  }\n\n  renderVals() {\n    const p = this.state.page;\n    const go = (page) => this.nav(page);\n\n    const allPackages = [\n      { title: \"Förvaltartjänster\", cat: \"Styrelsestöd\", desc: \"Din personlig
