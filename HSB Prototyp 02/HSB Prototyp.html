document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n        <p style=\"font-size:15px; line-height:1.55; margin:0 0 22px; max-width:52ch\">HSB erbjuder ett komplett utbud av tjänster för Brf och styrelser — ekonomi, fastighet och teknisk förvaltning anpassat för er förening.<\u002Fp>\n        <div style=\"display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px\">\n          <span style=\"font-size:14px; color:#3a3a3a\">Filtrera:<\u002Fspan>\n          <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ f.select }}\" style=\"border:1px solid {{ f.border }}; background:{{ f.bg }}; color:{{ f.fg }}; border-radius:6px; padding:7px 12px; font-size:13px; cursor:pointer; white-space:nowrap\" style-hover=\"border-color:#111\">{{ f.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"font-size:13px; color:#5a5a5a; margin:0 0 20px\">{{ startCount }}<\u002Fp>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr)); gap:20px\">\n          <sc-for list=\"{{ startPackages }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <div sc-camel-on-click=\"{{ p.go }}\" style=\"background:#f7f7f7; border:1px solid #e2e2e2; cursor:pointer; display:flex; flex-direction:column\" style-hover=\"border-color:#111\">\n              <div style=\"background:#dcdcdc; height:120px; display:flex; align-items:flex-end; padding:14px 16px\">\n                <span style=\"font-size:16px; font-weight:600\">{{ p.title }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"padding:16px; display:flex; flex-direction:column; gap:12px; flex:1\">\n                <div style=\"font-size:13px; line-height:1.55; color:#3a3a3a; flex:1\">{{ p.desc }}<\u002Fdiv>\n                <div style=\"font-size:13px; font-weight:600\">{{ p.link }} →<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ startHasMore }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"text-align:center; margin-top:24px\"><button sc-camel-on-click=\"{{ toggleStartMore }}\" style=\"background:none; border:none; font-size:14px; cursor:pointer; color:#111; padding:10px\">{{ startMoreLabel }}<\u002Fbutton><\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:#ececec; padding:56px 20px\">\n      <div style=\"max-width:1180px; margin:0 auto\">\n        <h2 style=\"font-size:clamp(24px,3.6vw,32px); margin:0 0 12px\">En utmärkelse som HSB fått<\u002Fh2>\n        <p style=\"font-size:15px; line-height:1.55; margin:0 0 26px; max-width:46ch\">HSB har under 100 år byggt upp ett förtroende som landets ledande bostadsaktör.<\u002Fp>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr)); gap:22px\">\n          <div style=\"display:flex; flex-direction:column; gap:10px\">\n            <div style=\"font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase\">Utmärkelser<\u002Fdiv>\n            <div style=\"background:#fff; padding:20px; display:flex; gap:18px; align-items:flex-start; flex:1\">\n              <div style=\"width:80px; height:80px; background:#d4d4d4; flex:none\"><\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:6px\">\n                <div style=\"font-size:12px; color:#5a5a5a\">Bästa förvaltare 2025<\u002Fdiv>\n                <div style=\"font-size:15px; font-weight:600\">Årets Fastighetsförvaltare<\u002Fdiv>\n                <div style=\"font-size:12px; line-height:1.5; color:#4a4a4a\">Tilldelad av Fastighetsbranschen Sverige för exceptionell kvalitet och kundnöjdhet.<\u002Fdiv>\n                <div style=\"font-size:12px; font-weight:600; text-decoration:underline; cursor:pointer\">Se fler utmärkelser →<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:10px\">\n            <div style=\"font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase\">Vad styrelser säger<\u002Fdiv>\n            <div style=\"background:#fff; padding:20px; display:flex; flex-direction:column; gap:12px; flex:1\">\n              <div style=\"font-size:14px; letter-spacing:2px\">★★★★★<\u002Fdiv>\n              <div style=\"font-size:14px; line-height:1.55\">”HSB har gjort vårt styrelsearbete så mycket enklare. Vi får rätt hjälp i rätt tid och alltid av kompetenta personer som känner vår förening.”<\u002Fdiv>\n              <div style=\"display:flex; gap:12px; align-items:center\">\n                <div style=\"width:36px; height:36px; border-radius:50%; background:#8a8a8a; flex:none\"><\u002Fdiv>\n                <div style=\"font-size:12px; line-height:1.4\"><div style=\"font-weight:600\">Anders Lindqvist<\u002Fdiv><div style=\"color:#5a5a5a\">Styrelseordförande, BRF Solsidan<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:#8a8a8a; padding:clamp(28px,5vw,48px) 20px\">\n      <div style=\"max-width:1180px; margin:0 auto; background:#3d3d3d; color:#fff; padding:clamp(22px,4vw,40px); display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr)); gap:28px; align-items:center\">\n        <div>\n          <div style=\"font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; margin-bottom:10px\">Kontakt eller offert<\u002Fdiv>\n          <h2 style=\"font-size:clamp(22px,3.2vw,28px); margin:0 0 12px\">Få ett erbjudande anpassat för din BRF<\u002Fh2>\n          <p style=\"font-size:15px; line-height:1.55; margin:0 0 22px; max-width:48ch\">Vi gör en kostnadsfri genomgång av er förenings behov och tar fram ett paket som passar er storlek och budget.<\u002Fp>\n          <div style=\"display:flex; gap:10px; flex-wrap:wrap\">\n            <button sc-camel-on-click=\"{{ openSheet }}\" style=\"background:#fff; color:#111; border:none; border-radius:6px; padding:12px 18px; font-size:14px; font-weight:600; cursor:pointer\" style-hover=\"opacity:.9\">Offertförfrågan<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ openSheet }}\" style=\"background:#8a8a8a; color:#fff; border:none; border-radius:6px; padding:12px 18px; font-size:14px; cursor:pointer\" style-hover=\"opacity:.9\">Kontakta mig<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff; color:#111; padding:18px; display:flex; gap:16px; align-items:center; flex-wrap:wrap\">\n          <div style=\"width:96px; height:80px; background:#d4d4d4; flex:none\"><\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:6px; flex:1; min-width:180px\">\n            <div style=\"font-size:15px; font-weight:600\">Din kontaktperson<\u002Fdiv>\n            <div style=\"font-size:12px; color:#5a5a5a\">{{ startContactSub }}<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ toggleForeningMenu }}\" style=\"align-self:flex-start; background:#3d3d3d; color:#fff; border:none; border-radius:6px; padding:9px 14px; font-size:13px; cursor:pointer; white-space:nowrap; min-height:40px\" style-hover=\"opacity:.9\">📍 {{ startContactBtn }} ⌄<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:#f2f2f2; padding:56px 20px\">\n      <div style=\"max-width:1100px; margin:0 auto; background:#fff; border-radius:12px; overflow:hidden\">\n        <div style=\"padding:24px clamp(18px,3vw,28px); border-bottom:1px solid #e6e6e6\">\n          <h2 style=\"font-size:clamp(20px,2.8vw,24px); margin:0 0 6px\">Stöd för dig i styrelsearbetet<\u002Fh2>\n          <p style=\"font-size:13px; color:#5a5a5a; margin:0 0 16px\">Välj din HSB-förening för att se anpassade resurser<\u002Fp>\n          <div style=\"display:flex; gap:8px; flex-wrap:wrap\">\n            <sc-for list=\"{{ startTabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ t.select }}\" style=\"background:{{ t.bg }}; color:{{ t.fg }}; border:1px solid {{ t.border }}; border-radius:6px; padding:8px 14px; font-size:13px; cursor:pointer; white-space:nowrap\">{{ t.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:24px clamp(18px,3vw,28px) 28px; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:28px\">\n          <div style=\"display:flex; flex-direction:column; gap:10px; grid-column:span 2; min-width:0\">\n            <h3 style=\"font-size:18px; margin:0\">{{ startTabTitle }}<\u002Fh3>\n            <p style=\"font-size:13px; color:#5a5a5a; margin:0 0 6px\">{{ startTabSub }}<\u002Fp>\n            <sc-for list=\"{{ startOffers }}\" as=\"o\" hint-placeholder-count=\"3\">\n              <div style=\"background:#f2f2f2; border:1px solid #e2e2e2; border-radius:8px; padding:14px 16px; display:flex; align-items:center; gap:14px; cursor:pointer\" style-hover=\"border-color:#111\">\n                <span style=\"width:30px; height:30px; border-radius:6px; background:#fff; border:1px solid #d4d4d4; flex:none; display:flex; align-items:center; justify-content:center; font-size:13px\">▤<\u002Fspan>\n                <div style=\"flex:1; min-width:0\">\n                  <div style=\"display:flex; gap:8px; align-items:center; flex-wrap:wrap\">\n                    <span style=\"font-size:14px; font-weight:600\">{{ o.title }}<\u002Fspan>\n                    <sc-if value=\"{{ o.isNew }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"background:#dcdcdc; border-radius:4px; padding:2px 7px; font-size:11px; font-weight:600\">Nyhet!<\u002Fspan><\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12px; color:#5a5a5a; margin-top:2px\">{{ o.sub }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-size:16px\">→<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"display:flex; gap:8px; flex-wrap:wrap; margin-top:8px\">\n              <button style=\"background:#111; color:#fff; border:none; border-radius:6px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer\">Logga in<\u002Fbutton>\n              <button style=\"background:#8a8a8a; color:#fff; border:none; border-radius:6px; padding:9px 14px; font-size:13px; cursor:pointer\">Bli medlem<\u002Fbutton>\n              <button style=\"background:#fff; color:#111; border:1px solid #cfcfcf; border-radius:6px; padding:9px 14px; font-size:13px; cursor:pointer\">{{ startTabAll }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#f2f2f2; display:flex; flex-direction:column; align-self:start\">\n            <div style=\"background:#c9c9c9; height:110px\"><\u002Fdiv>\n            <div style=\"padding:16px; display:flex; flex-direction:column; gap:8px\">\n              <div style=\"font-size:16px; font-weight:600\">Vill ni ha rådgivning?<\u002Fdiv>\n              <div style=\"font-size:13px; line-height:1.5; color:#3a3a3a\">Boka ett kostnadsfritt samtal med en HSB-expert. Vi hjälper dig!<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ openSheet }}\" style=\"align-self:flex-start; background:#8a8a8a; color:#fff; border:none; border-radius:6px; padding:9px 14px; font-size:13px; cursor:pointer; margin-top:4px\" style-hover=\"opacity:.9\">Boka möte<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:#d4d4d4; padding:56px 20px\">\n      <div style=\"max-width:1180px; margin:0 auto\">\n        <h2 style=\"font-size:clamp(22px,3.4vw,30px); margin:0 0 28px; text-align:center\">Det man gör ofta hos oss<\u002Fh2>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr)); gap:18px\">\n          <sc-for list=\"{{ startTasks }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <div style=\"background:#fff; display:flex; flex-direction:column\">\n              <div style=\"background:#6a6a6a; color:#fff; padding:22px 18px; font-size:17px; font-weight:600\">{{ t.title }}<\u002Fdiv>\n              <div style=\"padding:16px 18px 20px; display:flex; flex-direction:column; gap:14px; flex:1\">\n                <div style=\"font-size:13px; line-height:1.55; color:#3a3a3a; flex:1\">{{ t.text }}<\u002Fdiv>\n                <button style=\"align-self:flex-start; background:#6a6a6a; color:#fff; border:none; border-radius:6px; padding:8px 14px; font-size:12px; cursor:pointer\" style-hover=\"opacity:.9\">{{ t.cta }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <dc-import name=\"ArticlesSection\" heading=\"Nyheter och artiklar\" t1=\"Nyhet eller kampanj\" t2=\"Relevant artikel årsklockan tips\" t3=\"Relevant artikel regel-efterlevnad\" hint-size=\"100%,420px\"><\u002Fdc-import>\n    <dc-import name=\"FaqSection\" label=\"\" q1=\"Hur kommer jag i kontakt med min regionförening?\" q2=\"Varför ska jag välja HSB?\" q3=\"Vilka produkter rekommenderar ni att börja med?\" q4=\"Får man rabatt om man väljer flera produkter?\" q5=\"Hur arbetar man i en styrelse?\" q6=\"Vilka verktyg rekommenderas för digitalt styrelsearbete?\" hint-size=\"100%,360px\"><\u002Fdc-import>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ HUB: Fastighetsförvaltning ============ -->\n  <sc-if value=\"{{ isHub }}\" hint-placeholder-val=\"{{ true }}\">\n  <main style=\"flex:1\">\n    <section style=\"background:#d4d4d4; padding:56px 20px 64px\">\n      <div style=\"max-width:1180px; margin:0 auto\">\n        <h1 style=\"font-size:clamp(30px,6vw,52px); line-height:1.05; margin:0 0 10px; text-transform:uppercase; letter-spacing:-0.01em\">Fastighetsförvaltning<\u002Fh1>\n        <p style=\"margin:0; font-size:15px; color:#3a3a3a\">För bostadsrättsföreningar, samfälligheter och dagis<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding:56px 20px; max-width:1180px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:48px\">\n      <div>\n        <h2 style=\"font-size:clamp(24px,3.4vw,30px); margin:0 0 18px\">Vi hjälper dig genom alla steg<\u002Fh2>\n        <p style=\"font-size:15px; line-height:1.6; margin:0 0 22px; max-width:52ch\">Med över 100 års erfarenhet skapar vi stabila och välskötta bostadsrättsföreningar. Idag förvaltar vi cirka 340 000 lägenheter runt om i Sverige. Vi erbjuder allt ni behöver – ekonomi, fastighet och teknisk förvaltning – anpassat för er förening.<\u002Fp>\n        <p style=\"font-size:15px; font-weight:600; margin:0 0 16px\">Våra experter hjälper er att<\u002Fp>\n        <div style=\"display:flex; flex-direction:column; gap:14px; margin-bottom:28px\">\n          <div style=\"display:flex; gap:12px; align-items:flex-start\">\n            <span style=\"width:34px; height:34px; border-radius:8px; background:#ececec; flex:none\"><\u002Fspan>\n            <span style=\"font-size:14px; line-height:1.5\">Se till att underhåll och renoveringar sköts<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:12px; align-items:flex-start\">\n            <span style=\"width:34px; height:34px; border-radius:8px; background:#ececec; flex:none\"><\u002Fspan>\n            <span style=\"font-size:14px; line-height:1.5\">Säkerställer stabil ekonomi och håller energikostnaderna nere<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:12px; align-items:flex-start\">\n            <span style=\"width:34px; height:34px; border-radius:8px; background:#ececec; flex:none\"><\u002Fspan>\n            <span style=\"font-size:14px; line-height:1.5\">Sätter in tjänster som ni behöver hjälp med<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:10px; flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ openSheet }}\" style=\"background:#111; color:#fff; border:none; border-radius:6px; padding:12px 20px; font-size:14px; font-weight:600; cursor:pointer\" style-hover=\"opacity:.9\">Offertförfrågan<\u002Fbutton>\n          <button style=\"background:#fff; color:#111; border:1px solid #bdbdbd; border-radius:6px; padding:12px 20px; font-size:14px; cursor:pointer\" style-hover=\"background:#f2f2f2\">Hör av dig till oss<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"background:#ececec; aspect-ratio:4/3; width:100%; max-width:340px\"><\u002Fdiv>\n        <div style=\"display:flex; gap:16px; margin-top:24px; align-items:flex-start\">\n          <div style=\"width:74px; height:74px; background:#111; flex:none\"><\u002Fdiv>\n          <div style=\"font-size:12px; line-height:1.6\">\n            <div style=\"font-weight:600; font-size:13px\">{{ contactName }}<\u002Fdiv>\n            <div style=\"color:#5a5a5a\">{{ contactRole }}<\u002Fdiv>\n            <div style=\"text-decoration:underline; margin-top:6px\">0551-111 22 33<\u002Fdiv>\n            <div style=\"text-decoration:underline\">forvaltningstjanster@hsb.se<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:#f2f2f2; padding:56px 20px\">\n      <div style=\"max-width:1180px; margin:0 auto\">\n        <h2 style=\"font-size:clamp(26px,4vw,34px); margin:0 0 16px\">Våra tjänstepaket<\u002Fh2>\n        <div style=\"background:#3d3d3d; color:#fff; padding:12px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:18px\">\n          <span style=\"font-size:14px; flex:1\">Se lokala tilläggstjänster nära dig<\u002Fspan>\n          <button sc-camel-on-click=\"{{ toggleForeningMenu2 }}\" style=\"background:#fff; border:1px solid #cfcfcf; border-radius:999px; padding:7px 14px; font-size:13px; cursor:pointer; color:#111; white-space:nowrap\" style-hover=\"border-color:#111\">📍 {{ foreningLabel }} ⌄<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ foreningMenuOpen2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:relative; margin:4px 0 18px\">\n            <div style=\"position:absolute; top:-8px; right:60px; width:0; height:0; border-left:9px solid transparent; border-right:9px solid transparent; border-bottom:9px solid #1a1a1a\"><\u002Fdiv>\n            <div style=\"background:#1a1a1a; color:#fff; border-radius:12px; padding:clamp(18px,3vw,26px); display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr)); gap:24px 40px\">\n              <p style=\"margin:0; font-size:15px; line-height:1.6; max-width:38ch\">Välj din HSB regionsförening för att se lokala erbjudanden, kontaktpersoner, utbildningar och aktiviteter nära dig. Detta kan variera mellan olika regionsföreningar i HSB.<\u002Fp>\n              <div style=\"display:flex; flex-direction:column; gap:12px; grid-column:span 2; min-width:0\">\n                <div style=\"font-size:15px; font-weight:600\">Fyll i postnummer<\u002Fdiv>\n                <div style=\"display:flex; align-items:center; gap:14px 18px; flex-wrap:wrap\">\n                  <div style=\"display:flex; flex:1 1 240px; max-width:320px; background:#fff; border-radius:8px; overflow:hidden; border:1px solid #fff\">\n                    <input value=\"{{ postnr }}\" sc-camel-on-change=\"{{ onPostnr }}\" sc-camel-input-mode=\"numeric\" placeholder=\"Ex. 113 64\" style=\"flex:1; min-width:0; border:none; padding:12px 14px; font:inherit; font-size:15px; color:#111; outline:none\">\n                    <button sc-camel-on-click=\"{{ searchPostnr }}\" style=\"background:#1a1a1a; color:#fff; border:none; border-radius:7px; margin:2px; padding:0 18px; font-size:15px; font-weight:600; cursor:pointer; min-height:44px\" style-hover=\"opacity:.85\">Välj<\u002Fbutton>\n                  <\u002Fdiv>\n                  <span style=\"font-size:15px; font-weight:600\">eller<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ useGps }}\" style=\"background:none; color:#fff; border:1px solid #fff; border-radius:8px; padding:0 20px; min-height:48px; font-size:15px; cursor:pointer; display:flex; align-items:center; gap:10px; white-space:nowrap; flex:none\" style-hover=\"background:#2e2e2e\">📍 Använd platstjänster<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"font-size:13px; color:#d6d6d6\">Du kan även söka på stad eller kommun<\u002Fdiv>\n                <sc-if value=\"{{ hasLocMsg }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:13px; color:#fff\">{{ locMsg }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"height:1px; background:#5a5a5a; margin:8px 0 4px\"><\u002Fdiv>\n                <button sc-camel-on-click=\"{{ toggleListOpen }}\" style=\"background:none; border:none; color:#fff; padding:6px 0; font-size:15px; cursor:pointer; display:flex; align-items:center; gap:12px; align-self:flex-start; min-height:44px\">Välj din regionala HSB förening från lista <span style=\"display:inline-block; transform:rotate({{ listRot }}deg); transition:transform .2s\">⌄<\u002Fspan><\u002Fbutton>\n                <sc-if value=\"{{ listOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr)); gap:8px\">\n                    <sc-for list=\"{{ foreningar2 }}\" as=\"f\" hint-placeholder-count=\"5\">\n                      <button sc-camel-on-click=\"{{ f.select }}\" style=\"background:{{ f.darkBg }}; color:#fff; border:1px solid #5a5a5a; border-radius:6px; text-align:left; padding:10px 12px; font-size:14px; cursor:pointer; min-height:44px; font-weight:{{ f.weight }}\" style-hover= \n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:18px; align-items:flex-start\">\n          <div style=\"width:88px; height:88px; border-radius:50%; background:#d9d9d9; flex:none\"><\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.6\">\n            <div style=\"font-weight:600; margin-bottom:6px; text-decoration:underline\">{{ case2Label }}<\u002Fdiv>\n            <div style=\"color:#3a3a3a\">”asd asdasdas da as da asdad asd a da sdasd as dasd asdasd as da dasdd addd as”<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <dc-import name=\"FaqSection\" label=\"\" q1=\"Hur kommer jag i kontakt med min regionförening?\" q2=\"Varför ska jag välja HSB?\" q3=\"Vilka produkter rekommenderar ni att börja med?\" q4=\"Får man rabatt om man väljer flera produkter?\" q5=\"Hur arbetar man i en styrelse?\" q6=\"Vilka verktyg rekommenderas för digitalt styrelsearbete?\" hint-size=\"100%,360px\"><\u002Fdc-import>\n    <dc-import name=\"ArticlesSection\" t1=\"Relevant kampanj lokal / central\" t2=\"Relevant artikel årsklockan tips\" t3=\"Relevant artikel regel-efterlevnad\" hint-size=\"100%,420px\"><\u002Fdc-import>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ Förvaltartjänster ============ -->\n  <sc-if value=\"{{ isForvaltar }}\" hint-placeholder-val=\"{{ true }}\">\n  <main style=\"flex:1\">\n    <section style=\"background:#c9c9c9; padding:56px 20px 64px\">\n      <div style=\"max-width:1180px; margin:0 auto\">\n        <h1 style=\"font-size:clamp(30px,6vw,52px); line-height:1.05; margin:0 0 10px; text-transform:uppercase\">Förvaltartjänster<\u002Fh1>\n        <p style=\"margin:0; font-size:15px; color:#333\">Tjänsten gäller alla HSBs regionsföreningar<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding:56px 20px; max-width:1180px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:48px\">\n      <div>\n        <h2 style=\"font-size:clamp(26px,4vw,34px); margin:0 0 20px\">För en enklare vardag<\u002Fh2>\n        <p style=\"font-size:16px; line-height:1.6; margin:0 0 26px; max-width:52ch\">Alla styrelser har olika behov av professionellt stöd. Därför erbjuder vi tre flexibla tjänstenivåer. Oavsett om ni söker ett bollplank eller en strategisk och proaktiv partner så har vi en lösning för er. Vi har erfarenheten, kompetensen och den lokala närvaron som krävs för att ta hand om er fastighet på bästa sätt.<\u002Fp>\n        <div style=\"display:flex; gap:10px; flex-wrap:wrap\">\n          <button style=\"background:#111; color:#fff; border:none; border-radius:6px; padding:12px 20px; font-size:14px; font-weight:600; cursor:pointer\" style-hover=\"opacity:.9\">Anmäl intresse<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ openSheet }}\" style=\"background:#dcdcdc; border:none; border-radius:6px; padding:12px 20px; font-size:14px; cursor:pointer\" style-hover=\"background:#cfcfcf\">Kontakta oss<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"background:#d4d4d4; padding:26px 20px; text-align:center\">\n          <p style=\"margin:0 0 16px; font-size:15px; line-height:1.5\">Välj region för att hitta lokal kontaktperson eller lokala erbjudanden<\u002Fp>\n          <span style=\"background:#fff; border-radius:999px; padding:9px 16px; font-size:13px; display:inline-block\">Välj region ⌄<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:16px; margin-top:24px; align-items:flex-start\">\n          <div style=\"width:86px; height:86px; background:#111; border-radius:6px; flex:none\"><\u002Fdiv>\n          <div style=\"font-size:13px; line-height:1.6\">\n            <div style=\"font-weight:600; font-size:14px\">Sara Adamsson<\u002Fdiv>\n            <div style=\"color:#5a5a5a\">Säljare förvaltningstjänster<\u002Fdiv>\n            <div style=\"text-decoration:underline; margin-top:6px\">070-111 22 33<\u002Fdiv>\n            <div style=\"text-decoration:underline\">forvaltningstjanster@hsb.se<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:#f5f5f5; padding:56px 20px\">\n      <div style=\"max-width:1180px; margin:0 auto\">\n        <h2 style=\"font-size:clamp(24px,3.6vw,32px); margin:0 0 16px\">Fastighetsförvaltning på er nivå<\u002Fh2>\n        <p style=\"font-size:15px; line-height:1.6; margin:0 0 20px\">Oavsett om ni söker grundläggande trygghet för fastighetsägaransvar, heltäckande förvaltning eller en strategisk långsiktig partner – HSB har rätt nivå för er. Välj mellan nivåerna <strong>Förvaltare Bas<\u002Fstrong>, <strong>Fastighetsförvaltare<\u002Fstrong> eller <strong>Förvaltare Komplett.<\u002Fstrong><\u002Fp>\n        <div style=\"display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:26px\">\n          <span style=\"font-size:14px\">Tjänsterna gäller för alla HSBs regionsföreningar<\u002Fspan>\n          <span style=\"background:#e4e4e4; border-radius:999px; padding:6px 13px; font-size:13px\">Välj region ⌄<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:22px\">\n          <sc-for list=\"{{ levels }}\" as=\"lv\" hint-placeholder-count=\"3\">\n            <div style=\"background:#fff; border:1px solid #dcdcdc; display:flex; flex-direction:column\">\n              <div style=\"background:#d4d4d4; height:100px\"><\u002Fdiv>\n              <div style=\"padding:18px; border-bottom:1px solid #e6e6e6; font-size:16px; font-weight:600\">{{ lv.title }}<\u002Fdiv>\n              <div style=\"padding:18px; display:flex; flex-direction:column; gap:12px; flex:1\">\n                <div style=\"font-size:13px; color:#3a3a3a\">{{ lv.tagline }}<\u002Fdiv>\n                <ul style=\"margin:0; padding-left:18px; font-size:13px; line-height:1.7; flex:1\">\n                  <sc-for list=\"{{ lv.bullets }}\" as=\"b\" hint-placeholder-count=\"4\">\n                    <li>{{ b }}<\u002Fli>\n                  <\u002Fsc-for>\n                <\u002Ful>\n                <a href=\"{{ lv.href }}\" style=\"font-size:13px; font-weight:600; text-decoration:underline\">Se {{ lv.title }} →<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"background:#dedede; margin-top:34px; padding:26px; text-align:center\">\n          <p style=\"margin:0 0 16px; font-size:15px\">Kontakta oss så hittar vi en nivå som passar just er.<\u002Fp>\n          <button style=\"background:#111; color:#fff; border:none; border-radius:6px; padding:12px 20px; font-size:14px; font-weight:600; cursor:pointer\" style-hover=\"opacity:.9\">Kontakta oss<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding:56px 20px\">\n      <div style=\"max-width:1180px; margin:0 auto\">\n        <h2 style=\"font-size:clamp(24px,3.6vw,32px); margin:0 0 14px\">Jämför våra förvaltningsnivåer<\u002Fh2>\n        <p style=\"font-size:15px; margin:0 0 26px\">Välj mellan nivåerna <strong>Förvaltare Bas, Fastighetsförvaltare<\u002Fstrong> eller <strong>Förvaltare Komplett.<\u002Fstrong><\u002Fp>\n        <div style=\"overflow-x:auto; -webkit-overflow-scrolling:touch\">\n          <div style=\"min-width:640px\">\n            <div style=\"display:grid; grid-template-columns:minmax(220px,1fr) 130px 150px 150px; gap:0; padding:0 14px 12px; font-size:13px; font-weight:600\">\n              <div><\u002Fdiv><div style=\"text-align:center\">Förvaltare Bas<\u002Fdiv><div style=\"text-align:center\">Fastighets­förvaltare<\u002Fdiv><div style=\"text-align:center\">Förvaltare Komplett<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ compareRows }}\" as=\"r\" hint-placeholder-count=\"12\">\n              <div style=\"background:{{ r.bg }}; border:1px solid #e4e4e4; border-radius:4px; margin-bottom:6px\">\n                <div sc-camel-on-click=\"{{ r.toggle }}\" style=\"display:grid; grid-template-columns:minmax(220px,1fr) 130px 150px 150px; align-items:center; padding:14px; cursor:pointer\">\n                  <div style=\"font-size:13px; font-weight:600; padding-right:14px\">{{ r.label }}<span style=\"color:#6a6a6a; font-weight:400\"> ⌄<\u002Fspan><\u002Fdiv>\n                  <div style=\"text-align:center; font-size:15px\">{{ r.c1 }}<\u002Fdiv>\n                  <div style=\"text-align:center; font-size:15px\">{{ r.c2 }}<\u002Fdiv>\n                  <div style=\"text-align:center; font-size:15px\">{{ r.c3 }}<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ r.open }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:0 14px 14px; font-size:12px; line-height:1.6; color:#4a4a4a; max-width:60ch\">Text som beskriver vad det innebär. Abc abc abc abc abc abc abc abc abc abc abc abc<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:#f5f5f5; padding:40px 20px\">\n      <div style=\"max-width:1180px; margin:0 auto; display:flex; flex-direction:column; gap:44px\">\n        <sc-for list=\"{{ levelDetails }}\" as=\"d\" hint-placeholder-count=\"3\">\n          <div id=\"{{ d.id }}\" style=\"background:#d9d9d9; padding:clamp(24px,4vw,56px)\">\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:34px\">\n              <div>\n                <h3 style=\"font-size:clamp(24px,3.6vw,32px); margin:0 0 16px\">{{ d.title }}<\u002Fh3>\n                <p style=\"font-size:15px; line-height:1.6; margin:0 0 22px; max-width:44ch\">{{ d.intro }}<\u002Fp>\n                <div style=\"display:flex; flex-direction:column; gap:14px\">\n                  <sc-for list=\"{{ d.points }}\" as=\"pt\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex; gap:12px; align-items:center\">\n                      <span style=\"width:36px; height:36px; border-radius:50%; background:#efefef; flex:none\"><\u002Fspan>\n                      <span style=\"font-size:14px; line-height:1.45\">{{ pt }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background: #efefef; aspect-ratio: 1/1; width: 465px; height: 285px\"><\u002Fdiv>\n            <\u002Fdiv>\n            <h4 style=\"font-size:clamp(20px,3vw,26px); margin:38px 0 20px\">Detta ingår<\u002Fh4>\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px 40px\">\n              <sc-for list=\"{{ d.includes }}\" as=\"inc\" hint-placeholder-count=\"6\">\n                <div style=\"display:flex; gap:12px; align-items:flex-start\">\n                  <span style=\"font-size:15px; line-height:1.4\">✓<\u002Fspan>\n                  <span style=\"font-size:14px; font-weight:600; line-height:1.45\">{{ inc }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:10px; justify-content:center; margin-top:34px; flex-wrap:wrap\">\n              <button sc-camel-on-click=\"{{ openSheet }}\" style=\"background:#111; color:#fff; border:none; border-radius:6px; padding:12px 20px; font-size:14px; font-weight:600; cursor:pointer\" style-hover=\"opacity:.9\">Få offert<\u002Fbutton>\n              <sc-if value=\"{{ d.hasSheet }}\" hint-placeholder-val=\"{{ false }}\">\n                <button style=\"background:#111; color:#fff; border:none; border-radius:6px; padding:12px 20px; font-size:14px; font-weight:600; cursor:pointer\" style-hover=\"opacity:.9\">Ladda ner produktblad<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding:52px 20px\">\n      <div style=\"max-width:1180px; margin:0 auto\">\n        <h2 style=\"font-size:clamp(24px,3.6vw,32px); margin:0 0 22px\">Vad gör en förvaltare?<\u002Fh2>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:22px\">\n          <div style=\"background:#fff; border:1px solid #dcdcdc; display:flex; flex-direction:column; cursor:pointer\" style-hover=\"border-color:#111\">\n            <div style=\"background:#c4c4c4; aspect-ratio:16/9; width:100%\"><\u002Fdiv>\n            <div style=\"padding:20px; display:flex; flex-direction:column; gap:10px\">\n              <div style=\"font-size:12px; color:#5a5a5a\">Artikel · 4 min läsning<\u002Fdiv>\n              <div style=\"font-size:18px; font-weight:600; line-height:1.3\">Förvaltarens roll – styrelsens förlängda arm<\u002Fdiv>\n              <div style=\"font-size:14px; line-height:1.6; color:#3a3a3a\">En förvaltare kan fastighetsägaransvaret, lagkraven och leverantörsmarknaden. Läs om hur förvaltaren avlastar styrelsen i vardagen – från besiktningar och störningsärenden till samordning av leverantörer.<\u002Fdiv>\n              <div style=\"font-size:13px; font-weight:600; text-decoration:underline\">Läs artikeln →<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff; border:1px solid #dcdcdc; display:flex; flex-direction:column; cursor:pointer\" style-hover=\"border-color:#111\">\n            <div style=\"background:#c4c4c4; aspect-ratio:16/9; width:100%\"><\u002Fdiv>\n            <div style=\"padding:20px; display:flex; flex-direction:column; gap:10px\">\n              <div style=\"font-size:12px; color:#5a5a5a\">Artikel · 5 min läsning<\u002Fdiv>\n              <div style=\"font-size:18px; font-weight:600; line-height:1.3\">Fem saker en förvaltare kan hjälpa er förening med<\u002Fdiv>\n              <div style=\"font-size:14px; line-height:1.6; color:#3a3a3a\">Från underhållsplanering och upphandling till försäkringsärenden och kontakt med medlemmar. Här är områdena där en erfaren förvaltare gör störst skillnad för föreningens ekonomi och trivsel.<\u002Fdiv>\n              <div style=\"font-size:13px; font-weight:600; text-decoration:underline\">Läs artikeln →<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:#d9d9d9; padding:48px 20px\">\n      <div style=\"max-width:900px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:24px\">\n        <div style=\"background:#f2f2f2; padding:22px\">\n          <h3 style=\"font-size:18px; margin:0 0 16px\">Kunskapsbank<\u002Fh3>\n          <div style=\"display:flex; flex-direction:column; gap:14px\">\n            <div style=\"background:#fff; border:1px solid #e4e4e4; padding:14px; display:flex; gap:16px; align-items:center\">\n              <div style=\"width:96px; height:96px; background:#b3b3b3; flex:none\"><\u002Fdiv>\n              <div style=\"font-size:13px\"><div style=\"font-weight:600\">Abc<\u002Fdiv><div style=\"color:#5a5a5a\">Abc<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#fff; border:1px solid #e4e4e4; padding:14px; display:flex; gap:16px; align-items:center\">\n              <div style=\"width:96px; height:96px; background:#b3b3b3; flex:none\"><\u002Fdiv>\n              <div style=\"font-size:13px\"><div style=\"font-weight:600\">Abc<\u002Fdiv><div style=\"color:#5a5a5a\">Abc<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#f2f2f2; padding:22px\">\n          <h3 style=\"font-size:18px; margin:0 0 16px\">Dokument och länkar<\u002Fh3>\n          <div style=\"display:flex; flex-direction:column; gap:8px\">\n            <sc-for list=\"{{ docs }}\" as=\"doc\" hint-placeholder-count=\"6\">\n              <div style=\"background:#fff; border:1px solid #e4e4e4; border-radius:4px; padding:11px 14px; display:flex; align-items:center; gap:10px; cursor:pointer\" style-hover=\"border-color:#111\">\n                <span style=\"width:16px; height:18px; background:#d4d4d4; flex:none\"><\u002Fspan>\n                <span style=\"font-size:13px; text-decoration:underline; flex:1\">{{ doc.name }}<\u002Fspan>\n                <span style=\"font-size:13px; color:#6a6a6a\">{{ doc.icon }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <dc-import name=\"FaqSection\" label=\"HSB Förvaltartjänster\" q1=\"Vilken förvaltningsnivå ska jag välja?\" hint-size=\"100%,360px\"><\u002Fdc-import>\n    <dc-import name=\"ArticlesSection\" heading=\"Andra relaterade tjänster och artiklar\" t1=\"Omvärd\" t2=\"Nyhet / regler\" t3=\"xxxxx\" hint-size=\"100%,420px\"><\u002Fdc-import>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ Ekonomi Bas ============ -->\n  <sc-if value=\"{{ isEkonomi }}\" hint-placeholder-val=\"{{ true }}\">\n  <main style=\"flex:1\">\n    <section style=\"background:#c9c9c9; padding:56px 20px 64px\">\n      <div style=\"max-width:1180px; margin:0 auto\">\n        <h1 style=\"font-size:clamp(30px,6vw,52px); line-height:1.05; margin:0; text-transform:uppercase\">Ekonomi Bas<\u002Fh1>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding:56px 20px; max-width:1180px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:44px\">\n      <div>\n        <h2 style=\"font-size:clamp(24px,3.6vw,32px); margin:0 0 18px\">Ekonomisk förvaltning för brf<\u002Fh2>\n        <p style=\"font-size:15px; line-height:1.6; margin:0 0 22px; max-width:50ch\">En stabil grund att stå på inom ekonomisk förvaltning. Ni får koll på ekonomin och det administrativa och gör det enkelt att leva upp till lagar och regler. Alla är välkomna att ta del av tjänsten, även de som inte är medlemmar i HSB.<\u002Fp>\n        <div style=\"display:flex; flex-direction:column; gap:12px; margin-bottom:26px\">\n          <div style=\"display:flex; gap:12px; font-size:14px\"><span>✓<\u002Fspan><span>Få koll på din ekonomi<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; gap:12px; font-size:14px\"><span>✓<\u002Fspan><span>Lägre kostnader och ökade intäkter<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; gap:12px; font-size:14px\"><span>✓<\u002Fspan><span>Digitala verktyg<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; gap:12px; font-size:14px\"><span>✓<\u002Fspan><span>Specialist rådgivning ekonomi och juridik<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:10px; flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ openSheet }}\" style=\"background:#111; color:#fff; border:none; border-radius:6px; padding:12px 20px; font-size:14px; font-weight:600; cursor:pointer\" style-hover=\"opacity:.9\">Offertförfrågan<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ openSheet }}\" style=\"background:#e6e6e6; border:none; border-radius:6px; padding:12px 20px; font-size:14px; cursor:pointer\" style-hover=\"background:#dadada\">Kontakta mig<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#ececec; aspect-ratio:4/3; width:100%\"><\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:#f2f2f2; padding:52px 20px\">\n      <div style=\"max-width:1180px; margin:0 auto\">\n        <h2 style=\"font-size:clamp(22px,3.2vw,28px); margin:0 0 8px\">Detta ingår<\u002Fh2>\n        <p style=\"font-size:15px; line-height:1.6; margin:0 0 28px; color:#3a3a3a\">Deltjänster i vårt Ekonomi Bas tjänstepaket<\u002Fp>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:28px 34px\">\n          <sc-for list=\"{{ deltjanster }}\" as=\"d\" hint-placeholder-count=\"12\">\n            <div>\n              <div style=\"font-size:15px; font-weight:600; margin-bottom:8px\">{{ d }}<\u002Fdiv>\n              <p style=\"font-size:12px; line-height:1.55; color:#4a4a4a; margin:0 0 8px\">Lorem ipsum tincidunt massa placerat convallis. risus lorem. libero, placerat. tincidunt cursus hendrerit nisi leo.<\u002Fp>\n              <a href=\"#ko\" sc-camel-on-click=\"{{ goKo }}\" style=\"font-size:12px; font-weight:600; text-decoration:underline\">Till undersida →<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:#f7f7f7; padding:52px 20px\">\n      <div style=\"max-width:1180px; margin:0 auto\">\n        <h2 style=\"font-size:clamp(26px,4vw,34px); margin:0 0 14px\" data-comment-anchor=\"fef10ceffc-h2\">Hela utbudet i ekonomisk förvaltning<\u002Fh2>\n        <p style=\"font-size: 14px; line-height: 1.6; margin: 0 0 24px; color: #3a3a3a; max-width: 62ch; width: 562px; height: 64px\">Ekonomi Bas ger er föreningen en trygg grund med allt det löpande. Utöver grundpaketet väljer ni som styrelse själva till de tjänster ni behöver – så betalar ni bara för det som gör skillnad för just er förening.<\u002Fp>\n        <div style=\"background:#3d3d3d; color:#fff; padding:12px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:18px\">\n          <span style=\"font-size:14px; flex:1\">Se lokala tilläggstjänster nära dig<\u002Fspan>\n          <button sc-camel-on-click=\"{{ toggleForeningMenu3 }}\" style=\"background:#fff; border:1px solid #cfcfcf; border-radius:999px; padding:7px 14px; font-size:13px; cursor:pointer; color:#111; white-space:nowrap\" style-hover=\"border-color:#111\">📍 {{ foreningLabel }} ⌄<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ foreningMenuOpen3 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:relative; margin:4px 0 18px\">\n            <div style=\"po
