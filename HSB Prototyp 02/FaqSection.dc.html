<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section style="background:#f5f5f5; padding:52px 20px">
  <div style="max-width:1180px; margin:0 auto">
    <h2 style="font-size:clamp(24px,3.6vw,32px); margin:0 0 4px">Vanliga frågor och svar</h2>
    <sc-if value="{{ hasLabel }}" hint-placeholder-val="{{ false }}">
      <p style="font-size:14px; color:#3a3a3a; margin:0 0 8px">{{ label }}</p>
    </sc-if>
    <div style="height:20px"></div>
    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px">
      <sc-for list="{{ items }}" as="q" hint-placeholder-count="6">
        <div style="background:#fff; border:1px solid #dcdcdc; border-radius:4px">
          <div onClick="{{ q.toggle }}" style="padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer">
            <span style="font-size:13px; font-weight:600; flex:1">{{ q.text }}</span>
            <span style="font-size:13px; color:#6a6a6a">⌄</span>
          </div>
          <sc-if value="{{ q.open }}" hint-placeholder-val="{{ false }}">
            <div style="padding:0 16px 16px; font-size:12px; line-height:1.6; color:#4a4a4a">Svarstext. En stabil grund att stå på inom ekonomisk förvaltning. Ni får koll på ekonomin och det administrativa.</div>
          </sc-if>
        </div>
      </sc-for>
    </div>
    <div style="margin-top:16px"><span style="font-size:13px; text-decoration:underline; cursor:pointer">Gå till alla frågor och svar ↗</span></div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;q1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;q2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;q3&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;q4&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;q5&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;q6&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: null };
  renderVals() {
    const first = [this.props.q1, this.props.q2, this.props.q3, this.props.q4, this.props.q5, this.props.q6].filter(Boolean);
    const texts = [];
    for (let i = 0; i < 6; i++) texts.push(i < first.length ? first[i] : "Accordion title");
    const order = [texts[0], texts[3], texts[1], texts[4], texts[2], texts[5]];
    return {
      label: this.props.label || "",
      hasLabel: !!this.props.label,
      items: order.map((text, i) => ({
        text,
        open: this.state.open === i,
        toggle: () => this.setState(s => ({ open: s.open === i ? null : i }))
      }))
    };
  }
}
</script>
</body>
</html>
